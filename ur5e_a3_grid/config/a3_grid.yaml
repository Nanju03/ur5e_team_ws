/**:
  ros__parameters:
    planning_group: ur5e_arm
    home_pose: home
    reference_frame: world
    ik_link: tool0
    tcp_link: grasp_link
    planning_scene_service: /get_planning_scene

    # Measured 420 x 297 x 10 mm pocket plate. The runtime profile supplies
    # the 24 real pocket coordinates and a user-selected empty stack pocket.
    plate_enabled: true
    geometry_profile: cube_plate_v1
    plate_center_xy: [0.4, 0.0]
    plate_yaw_deg: -90.0
    plate_bottom_z: 0.800
    plate_alignment_clearance: 0.05
    plate_alignment_tip_clearance: 0.010  # Whole gripper tip is 10 mm above the rim.
    plate_alignment_gripper_position: 0.65

    # A3 portrait: 297 x 420 mm; 4 columns in +X, 6 rows in -Y.
    size_x: 0.297
    size_y: 0.420
    columns: 4
    rows: 6
    grid_yaw_deg: 0.0

    # Calculate the centre position/height from the named home's TCP FK.
    # vertical: zero gripper tilt to the table; home: original named-home orientation.
    orientation_mode: vertical
    approach_link: ag95_base_link  # Its +Z is the physical gripper approach direction.
    # These offsets translate the grid in reference_frame.
    center_from_home: true
    center_xyz: [0.0, 0.0, 0.0]  # Used only when center_from_home=false.
    center_offset_xyz: [0.0, 0.0, 0.0]

    # scan/cell: travel height only; pick_cycle/pick_cell: descend, close, lift, reopen.
    # home: named home; preview: check the travel-height scan only.
    operation: scan
    cell_id: 1
    execute: false
    return_to_center: true  # Applies to scan/preview, not to a single cell move.
    check_corners: true
    prepare_home_if_needed: true

    # All Z values are in reference_frame, not relative to the robot base.
    table_link: workbench
    table_surface_z: 0.800
    block_size_xyz: [0.025, 0.025, 0.025]
    grasp_height_above_table: 0.0125  # 25 mm cube midpoint above the table.
    gripper_group: dh_ag95_gripper
    gripper_joint: left_outer_knuckle_joint
    # AG95 model: 0=fully open, 0.93=fully closed (radians).
    # These positions give approx. 59 mm open and 30 mm grasp gaps in the model.
    gripper_open_position: 0.40
    gripper_grasp_position: 0.73
    gripper_velocity_scaling: 0.4
    gripper_acceleration_scaling: 0.4
    gripper_pause: 0.2  # Seconds after each gripper action.

    velocity_scaling: 0.2
    acceleration_scaling: 0.2
    cartesian_step: 0.005
    jump_threshold: 5.0
    max_joint_step: 0.35
    height_tolerance: 0.001
    orientation_tolerance: 0.001
    planning_time: 10.0

    # Empty uses ~/.ros/ur5e_a3_grid/a3_grid_points.csv.
    coordinates_file: ""
    keep_alive: true  # Keeps RViz grid markers available; Ctrl+C closes this client.

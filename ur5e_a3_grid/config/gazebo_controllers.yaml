controller_manager:
  ros__parameters:
    use_sim_time: true
    # Refresh targets/feedback on each 1 ms ODE step used by GazeboSystem PID.
    update_rate: 1000
    ur5e_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    dh_ag95_gripper_controller:
      type: effort_controllers/GripperActionController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

ur5e_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      shoulder_pan_joint: {trajectory: 0.2, goal: 0.03}
      shoulder_lift_joint: {trajectory: 0.2, goal: 0.03}
      elbow_joint: {trajectory: 0.2, goal: 0.03}
      wrist_1_joint: {trajectory: 0.2, goal: 0.03}
      wrist_2_joint: {trajectory: 0.2, goal: 0.03}
      wrist_3_joint: {trajectory: 0.2, goal: 0.03}

dh_ag95_gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: left_outer_knuckle_joint
    max_effort: 1.2
    goal_tolerance: 0.01
    allow_stalling: true
    # Gazebo contact feedback jitters around 0.04--0.114 rad/s even when
    # the gripper is blocked by the cube. Initial free closure exceeds 0.8.
    stall_velocity_threshold: 0.20
    stall_timeout: 1.0
    gains:
      # I=0 avoids dependence on the effort adapter's wall-clock integration.
      # At 1 kHz, D=0.12 produced alternating ~1.18 rad/s feedback on block
      # contact (source 10), so the stall detector never completed the grasp.
      left_outer_knuckle_joint: {p: 12.0, i: 0.0, d: 0.04, i_clamp: 0.0}

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

/**:
  ros__parameters:
    stack_mode: scene  # scene, plan, run, reset
    target_cell: 0     # Select the pocket whose existing block forms layer 1.
    obstacle_cells: []
    empty_cells: []  # Explicitly empty squares; all other non-obstacle squares contain blocks.
    obstacle_size_xyz: [0.025, 0.025, 0.150]  # 150 mm axis is vertical.
    placement_mode: side  # Vertical through layer 19, then side placement from layer 20.
    vertical_placement_layers: 19  # Physical layers, including the foundation block.
    placement_approach_clearance: 0.120  # Lowest gripper/carried-block point above the existing tower during crossing.
    side_clearance: 0.060
    vertical_fallback_layers: 4  # Legacy side-failure fallback; the forced vertical section takes precedence.
    place_clearance: 0.040
    velocity_scaling: 0.25
    acceleration_scaling: 0.30
    gripper_open_position: 0.40  # Default open value; alignment uses 0.65.
    gripper_grasp_position: 0.73
    staged_release_enabled: true
    release_first_position: 0.70
    release_clearance_position: 0.60
    split_stack_speeds: true
    approach_velocity_scaling: 0.05
    transfer_velocity_scaling: 0.20
    stack_acceleration_scaling: 0.05  # Legacy approach fallback; explicit phase values below take precedence.
    approach_acceleration_scaling: 0.05
    transfer_acceleration_scaling: 0.20  # Includes lifting and retreating.
    touch_links: [left_finger_pad, right_finger_pad, left_finger, right_finger]

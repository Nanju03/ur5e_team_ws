/**/controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    update_rate: 100
/**/scaled_joint_trajectory_controller:
  ros__parameters:
    command_interfaces:
    - position
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.01
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    state_interfaces:
    - position
    - velocity
